plugins {
    id "com.android.application"
}

task checkAbi(type: Exec) {
    environment "ANDROID_NDK_HOME", android.ndkDirectory
    commandLine "sh", "${rootDir}/../tools/check_abi_layout.sh"
}

android {
    namespace "com.acgc.town"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.acgc.town"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "armeabi-v7a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir "../../shaders"
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    preBuild.dependsOn checkAbi

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
