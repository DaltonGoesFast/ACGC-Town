plugins {
    id "com.android.application"
}

android {
    namespace "com.acgc.town"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.acgc.town"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.3.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir "../../shaders"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

task checkAbi(type: Exec) {
    commandLine "sh", "${rootDir}/../tools/check_abi_layout.sh"
}
afterEvaluate {
    checkAbi.environment "ANDROID_NDK_HOME", android.ndkDirectory.absolutePath
}
preBuild.dependsOn checkAbi
